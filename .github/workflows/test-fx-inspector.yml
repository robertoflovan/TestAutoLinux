name: Test experimental JavaFX inspector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '8'
          java-package: jdk+fx
      - name: Install graphical test dependencies on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk2.0-0 libgtk-3-0 libxtst6 libxrender1 libxi6 fonts-dejavu-core xvfb xauth xdotool openbox dbus-x11
      - name: Compile Java 8 agent and demo
        run: bash fx-lab/build.sh
      - name: Exercise real JavaFX controls and reader lifecycle
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 -noreset' bash fx-lab/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-inspector-lab
          path: |
            target/fx-lab-build/fx-lab-v1/
            target/fx-lab-build/test-logs/
          if-no-files-found: error
          retention-days: 30
