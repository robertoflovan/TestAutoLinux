name: Build experimental Java ATK bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install build tools on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev libdbus-1-dev libgtk2.0-dev libgirepository1.0-dev x11-utils xvfb xauth xdotool dbus-x11 at-spi2-core
      - name: Build original and corrected libraries
        run: bash scripts/build-atk-bridge.sh
      - name: Test isolated Swing window and reader disconnects
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 -noreset' bash scripts/test-atk-bridge.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-atk-experimental
          path: |
            target/atk-build/delivery/
            target/atk-build/test-logs/
          if-no-files-found: error
          retention-days: 30
